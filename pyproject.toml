[project]
name = "civicpulse"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiokafka>=0.14.0",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.150.0",
    "pgvector>=0.5.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
